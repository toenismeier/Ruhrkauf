<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Referenz Coffee 20</title>
<link rel="stylesheet" href="../src/ui/hartwig.css">
<style>html, body { margin: 0; height: 100%; background: #000; }</style></head>
<body>
<div class="hw" data-bereich="coffee-zentrale" style="width:402px;height:874px">
  <div class="hw-grund"></div>
  <header class="hw-kopf">
    <img class="hw-kopf-symbol" src="coffee/20-logo.png" alt="">
    <div class="hw-kopf-titel">S&amp;G HQ</div>
    <div class="hw-kopf-unter">977 Alaskan Way, Seattle</div>
    <button class="hw-zu" aria-label="Schließen"></button>
  </header>
  <div class="hw-sprecher">
    <div class="hw-sprecher-text">Here are the latest financial statements.</div>
    <img class="hw-sprecher-figur" src="coffee/20-figur.png" alt="">
    <div class="hw-griff"></div>
  </div>
  <main class="hw-inhalt">
    <div class="hw-kopfbild"><img src="coffee/20-kopfbild.png" alt="">
      <button class="hw-bildknopf hw-kontur" style="left:20px;top:258px"><img src="coffee/20-personal.png" alt=""></button></div>
    <div style="height:64px"></div>
    <div class="hw-paar">
      <div><span class="hw-marke">Total Revenue</span><span class="hw-zahl">217.656.436 €</span><span class="hw-abw">+2.265.000 € (+1%)</span></div>
      <div><span class="hw-marke">Net Income</span><span class="hw-zahl hw-gut">80.394.931 €</span><span class="hw-abw">-3.507.173 € (-4%)</span></div>
    </div>
    <div style="height:27.7px"></div>
    <div class="hw-balken" style="--hoehe:113.3px">
      <div><i style="height:113.3px"></i><i style="height:33.7px"></i></div>
      <div><i style="height:113.3px"></i><i style="height:33.7px"></i></div>
      <div><i style="height:113.3px"></i><i style="height:33.7px"></i></div>
      <div><i style="height:113.3px"></i><i style="height:33.7px"></i></div>
      <div><i style="height:113.3px"></i><i style="height:33.7px"></i></div>
    </div>
  </main>
  <nav class="hw-reiter">
    <button aria-selected="true"><img src="coffee/20-reiter-1.png" alt=""><span>Finance</span></button>
    <button><img src="coffee/20-reiter-2.png" alt=""><span>Supply</span></button>
    <button><img src="coffee/20-reiter-3.png" alt=""><span>Executive</span></button>
    <button><img src="coffee/20-reiter-4.png" alt=""><span>Investment</span></button>
    <button><span style="top:6px;font-size:38px;font-weight:300;line-height:1">+</span><span>Add Floor</span></button>
  </nav>
</div>
</body></html>
