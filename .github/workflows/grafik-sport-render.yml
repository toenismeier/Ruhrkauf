name: Hartwig Sport - Grafikkataloge (Nachrendern)
on:
  push:
    branches: [feat/grafik-sport]
    paths: [.github/workflows/grafik-sport-render.yml]
permissions:
  contents: write
jobs:
  rendern:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: render/package-lock.json
      - name: Render-Abhängigkeiten
        working-directory: render
        run: |
          npm ci
          npx playwright install --with-deps chromium
          BROWSER=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")
          sudo mkdir -p /opt/pw-browsers/chromium-1194/chrome-linux
          sudo ln -sf "$BROWSER" /opt/pw-browsers/chromium-1194/chrome-linux/chrome
      - name: Kataloge rendern
        working-directory: render
        run: |
          mkdir -p out
          for katalog in sporthaeuser sport-etagen sport-zustaende sport-feeling; do
            echo "Starte Katalog $katalog"
            timeout 900 node render-katalog.js "$katalog"
            test -s "out/katalog-$katalog.png"
          done
      - name: PNGs im Repository ablegen
        run: |
          cp render/out/katalog-sporthaeuser.png bilder/katalog-sporthaeuser.png
          cp render/out/katalog-sport-etagen.png bilder/katalog-sport-etagen.png
          cp render/out/katalog-sport-zustaende.png bilder/katalog-sport-zustaende.png
          cp render/out/katalog-sport-feeling.png bilder/katalog-sport-feeling.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bilder/katalog-sporthaeuser.png bilder/katalog-sport-etagen.png bilder/katalog-sport-zustaende.png bilder/katalog-sport-feeling.png
          git commit -m "Sportgrafik: vier aktualisierte Katalogbilder" || exit 0
          git push origin HEAD:feat/grafik-sport
      - name: Gesamte Grafik- und Spielprüfung
        working-directory: render
        run: |
          mkdir -p out
          timeout 900 node pruef-staedte.js | tee out/sport-pruef-staedte.log
          timeout 900 node pruef-gestaltung.js | tee out/sport-pruef-gestaltung.log
          timeout 900 node spiel-render.js | tee out/sport-spiel-render.log
      - name: Ergebnisprotokolle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hartwig-sport-kataloge
          path: |
            render/out/katalog-sport*.png
            render/out/sport-pruef-*.log
            render/out/sport-spiel-render.log
          if-no-files-found: ignore
