name: Schwesterkette Grafikabnahme
on:
  push:
    branches: [feat/grafik-schwesterkette]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schwesterkette-grafik
  cancel-in-progress: true

jobs:
  kataloge:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: render/package-lock.json
      - run: npm ci
        working-directory: render
      - run: npx playwright install --with-deps chromium
        working-directory: render
      - name: "24 Standorte und 112 Stadtpläne"
        run: node pruef-schwester.js
        working-directory: render
      - name: Bestehende Städteprüfung
        run: node pruef-staedte.js
        working-directory: render
      - name: Gestaltung aller 112 Städte
        run: node pruef-alle-gestaltung.js
        working-directory: render
      - name: Katalog Schwesterhäuser
        run: node render-katalog.js schwesterhaeuser ../bilder/katalog-schwesterhaeuser.png
        working-directory: render
      - name: Katalog Etagen
        run: node render-katalog.js schwester-etagen ../bilder/katalog-schwester-etagen.png
        working-directory: render
      - name: Kleine Fassadenstichprobe
        run: node render-katalog.js schwester-stichprobe ../bilder/katalog-schwester-stichprobe.png
        working-directory: render
      - name: Direktvergleich Volkskauf gegen Hartwig
        run: node render-katalog.js schwester-vergleich ../bilder/katalog-schwester-vergleich.png
        working-directory: render
      - name: Fernstufe aller 24 Häuser
        run: node render-katalog.js schwester-fern ../bilder/katalog-schwester-fern.png
        working-directory: render
      - name: Prüfprotokoll sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schwesterkette-kataloge
          path: |
            render/out/schwester-gestaltung.txt
            bilder/katalog-schwesterhaeuser.png
            bilder/katalog-schwester-etagen.png
            bilder/katalog-schwester-stichprobe.png
            bilder/katalog-schwester-vergleich.png
            bilder/katalog-schwester-fern.png
          if-no-files-found: ignore
      - name: Renderbilder im Feature-Branch ablegen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/katalog-schwesterhaeuser.png bilder/katalog-schwester-etagen.png bilder/katalog-schwester-stichprobe.png bilder/katalog-schwester-vergleich.png bilder/katalog-schwester-fern.png
          if ! git diff --cached --quiet; then
            git commit -m "Schwesterkette: gerenderte Katalogbilder [skip ci]"
            git push
          fi
