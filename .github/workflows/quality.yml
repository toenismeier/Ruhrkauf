name: Ruhrkauf Qualität
# Nur bei PRs gegen main und von Hand. Kein Lauf bei jedem Push (spart Minuten und Benachrichtigungen).
on:
  pull_request:
    branches: [main]
    types: [opened, ready_for_review, reopened]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: Engine und TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci
        working-directory: engine
      - run: npm run typecheck
        working-directory: engine
      # Mehrere Worker: die Langläufe (Bot über 260 Wochen) sprengen sonst das Zeitlimit.
      - run: npm test -- --maxWorkers=4 --silent
        working-directory: engine

  moebel:
    name: Ladenbau Möbelprüfung
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: render/package-lock.json
      - run: npm ci
        working-directory: render
      - run: node pruef-moebel.js
        working-directory: render

  moebelkataloge:
    name: Ladenbau Katalogbilder
    runs-on: ubuntu-latest
    needs: moebel
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/ladenbau'
    permissions:
      contents: write
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: render/package-lock.json
      - run: npm ci
        working-directory: render
      - run: npx playwright install --with-deps chromium
        working-directory: render
      - name: Möbelkataloge rendern
        working-directory: render
        run: |
          mkdir -p out
          node render-katalog.js moebel-reihen
          node render-katalog.js moebel-outlet
          node render-katalog.js moebel-allgemein
          node render-katalog.js moebel-sport
      - name: Geprüfte Möbelbilder im Branch versionieren
        run: |
          mkdir -p bilder
          cp render/out/katalog-moebel-{sport,outlet,allgemein,reihen}.png bilder/
          git add bilder/katalog-moebel-{sport,outlet,allgemein,reihen}.png
          if git diff --cached --quiet; then
            echo "Bilder unverändert"
            exit 0
          fi
          git fetch origin feat/ladenbau
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/feat/ladenbau)" ]; then
            echo "Veralteter Kataloglauf: neuer Commit vorhanden, kein Bild-Push"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "assets(ladenbau): geprüfte Möbelkataloge"
          git push origin HEAD:feat/ladenbau
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ladenbau-kataloge
          path: render/out/katalog-moebel-*.png
          if-no-files-found: warn

  browser:
    name: Mobiler Browser-Smoketest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: render/package-lock.json
      - run: npm ci
        working-directory: render
      - run: npx playwright install --with-deps chromium
        working-directory: render
      - run: npm run build
        working-directory: render
      - run: npm test
        working-directory: render
      - run: node spiel-render.js --nur-posteingang
        working-directory: render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke
          path: |
            render/out/
            render/bilder/
          if-no-files-found: ignore

  fingerabdruck:
    name: Stadt-Fingerabdruck (112 Städte)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: render/package-lock.json
      - run: npm ci
        working-directory: render
      - run: npx playwright install --with-deps chromium
        working-directory: render
      - name: Plan, Geometrie und Referenzbilder prüfen
        run: npm run fingerabdruck:pruefen
        working-directory: render
        env:
          FINGERABDRUCK_ZEITLIMIT_S: '1500'
