name: Ruhrkauf Qualität
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: Engine und TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci
        working-directory: engine
      - run: npm run typecheck
        working-directory: engine
      - run: npm test -- --runInBand --silent
        working-directory: engine

  browser:
    name: Mobiler Browser-Smoketest
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: render/package-lock.json
      - run: npm ci
        working-directory: render
      - run: npx playwright install --with-deps chromium
        working-directory: render
      - run: npm run build
        working-directory: render
      - run: npm test
        working-directory: render
      - run: node spiel-render.js --nur-posteingang
        working-directory: render
      # Einmalig: Bundle nach erfolgreichen Tests ins Feature-Branch übernehmen,
      # damit spiel.html ohne lokale Build-Schritte die neue Oberfläche lädt.
      - name: Built bundle aktualisieren
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/spiel-posteingang'
        run: |
          if ! git diff --quiet -- render/spiel-bundle.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add render/spiel-bundle.js
            git commit -m "build: aktualisiertes Spiel-Bundle für Posteingang"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke
          path: |
            render/out/
            render/bilder/
          if-no-files-found: ignore
