name: EAS-Status (temporär)
on: push
jobs:
  s:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - env: { EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}" }
        run: |
          npx -y eas-cli@latest workflow:view 01a1782d-ba9c-7000-b5ab-b7ea31928f38 --json || true
          npx -y eas-cli@latest workflow:logs 01a1782d-ba9c-7000-b5ab-b7ea31928f38 --non-interactive || true
          npx -y eas-cli@latest account:usage --json || true
