# Build-Zug Dienstag und Freitag 18 Uhr (Winterzeit; Cron in UTC), kein Lauf bei jedem Push.
# Ist die native Hülle unverändert, geht das Spiel als Update raus (App lädt es beim nächsten Start).
# Hat sich die Hülle geändert (neues natives Modul, app.json), wird neu gebaut und an TestFlight übermittelt.
# Außer der Reihe nur von Hand: npx eas-cli@latest workflow:run .eas/workflows/ausliefern.yml
name: Ausliefern

on:
  schedule:
    - cron: '0 17 * * 2,5'

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    environment: production
  get_ios_build:
    name: Vorhandenen iOS-Build suchen
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: production
  build_ios:
    name: iOS bauen
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: production
  submit_ios_build:
    name: An TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
  publish_ios_update:
    name: Update veröffentlichen
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    params:
      branch: production
      platform: ios
