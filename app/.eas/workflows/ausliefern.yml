# Build-Zug Dienstag und Freitag 18 Uhr (Winterzeit; Cron in UTC), kein Lauf bei jedem Push.
# Ummo 23.10.2026: Auslieferung immer über TestFlight. Jeder Lauf baut die iOS-App neu und reicht sie bei TestFlight ein;
# keine Updates über Expo (expo-updates prüft beim Start nicht mehr).
# Außer der Reihe: GitHub-Workflow .github/workflows/ausliefern.yml (workflow_dispatch) oder
#   npx eas-cli@latest workflow:run .eas/workflows/ausliefern.yml
name: Ausliefern

on:
  schedule:
    - cron: '0 17 * * 2,5'

jobs:
  build_ios:
    name: iOS bauen
    type: build
    params:
      platform: ios
      profile: production
  submit_ios_build:
    name: An TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
